<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Velada del Año - Reserva d'Entrades</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero-section {
      position: relative;
      height: 320px;
      background: linear-gradient(rgba(9, 9, 13, 0.72), rgba(9, 9, 13, 0.85)), url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
      border-radius: 20px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      padding: 20px;
    }
    .hero-section h1 {
      color: #FFFFFF;
      font-size: 2.8rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .highlight-text {
      color: var(--accent-gold);
    }
    .form-box {
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group input, .form-group select {
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .section-divider {
      width: 100%;
      height: 1px;
      background: rgba(230, 57, 70, 0.4);
      margin: 25px 0;
    }
    .btn-primary {
      width: 100%;
    }
    #email-status {
      display: block;
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="img/LOGOVELADA.png" alt="Logo La Velada VII" class="logo-img">
      <span class="logo-text">LA VELADA VII</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inici</a></li>
        <li><a href="combats.html">Combats</a></li>
        <li><a href="entrades.html" class="active">Entrades</a></li>
        <li><a href="faq.html">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1>Reserva de les teves <span class="highlight-text">Entrades</span></h1>
    </section>

    <form id="ticket-form" class="form-box">
      <div class="form-group">
        <label for="zone">Zona de l'Estadi:</label>
        <select id="zone" name="zone" required>
          <option value="" disabled selected>Selecciona una zona</option>
          <option value="50">Grada Alta (50 €)</option>
          <option value="80">Grada Baixa (80 €)</option>
          <option value="120">Pista / Ring (120 €)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tickets">Nombre d'entrades (màx. 4):</label>
        <input type="number" id="tickets" name="tickets" min="1" max="4" value="1" required>
      </div>

      <div class="form-group">
        <label for="fullname">Nom i Cognoms:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Ex: Marc Garcia" required>
      </div>

      <div class="form-group">
        <label for="email">Correu Electrònic:</label>
        <input type="email" id="email" name="email" placeholder="exemple@correu.com" required>
        <small id="email-status"></small>
      </div>

      <div class="section-divider"></div>

      <div class="price-calculator">
        <p>Preu entrades: <span id="subtotal">0,00</span> €</p>
        <p>Despeses de gestió (10%): <span id="fees">0,00</span> €</p>
        <h3>Total: <span id="total-price">0,00</span> €</h3>
      </div>

      <button type="submit" class="btn-primary">Finalitzar Compra</button>
    </form>

    <div id="confirmation-msg" class="modal hidden">
      <div class="modal-content">
        <h3>Gràcies per la teva compra!</h3>
        <p id="summary-text"></p>
        <button id="close-btn" class="btn-primary">Tancar</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WDHL Solutions. Projecte de Walid fictici.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
