<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Velada del Año - Inici</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero-split {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 50px;
      padding: 40px 10px 60px;
      position: relative;
    }

    .hero-split::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 320px;
      background: radial-gradient(circle, rgba(230, 57, 70, 0.22) 0%, transparent 70%);
      filter: blur(45px);
      z-index: -1;
      pointer-events: none;
    }

    .hero-info {
      text-align: left;
    }

    .hero-info h1 {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 20%, #FF4D6D 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 20px rgba(230, 57, 70, 0.35));
      margin-bottom: 1rem;
    }

    .hero-info .subtitle {
      font-size: 1.25rem;
      color: #D0D4E0;
      margin-bottom: 1.2rem;
    }

    .hero-info .date {
      display: inline-block;
      padding: 8px 22px;
      border-radius: 50px;
      background: rgba(255, 209, 102, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.35);
      color: var(--accent-gold);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.15);
    }

    .hero-info .countdown-container {
      justify-content: flex-start;
      gap: 16px;
      margin: 32px 0;
    }

    .hero-info .time-card {
      min-width: 98px;
      padding: 20px 16px;
    }

    .hero-info .time-card span {
      font-size: 2.6rem;
    }

    .poster-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .poster-wrapper::after {
      content: '';
      position: absolute;
      inset: 10%;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.25) 0%, rgba(230, 57, 70, 0.2) 50%, transparent 75%);
      filter: blur(30px);
      z-index: -1;
    }

    .event-poster {
      width: 100%;
      max-width: 410px;
      height: auto;
      border-radius: 22px;
      border: 2px solid rgba(255, 209, 102, 0.35);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(230, 57, 70, 0.25);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
      object-fit: cover;
    }

    .event-poster:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent-gold);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 209, 102, 0.35);
    }

    @media (max-width: 920px) {
      .hero-split {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 40px;
        padding-top: 20px;
      }

      .hero-info {
        text-align: center;
      }

      .hero-info h1 {
        font-size: 3rem;
      }

      .hero-info .countdown-container {
        justify-content: center;
      }

      .event-poster {
        max-width: 340px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="img/LOGOVELADA.png" alt="Logo La Velada VII" class="logo-img">
      <span class="logo-text">LA VELADA VII</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Inici</a></li>
        <li><a href="combats.html">Combats</a></li>
        <li><a href="entrades.html">Entrades</a></li>
        <li><a href="faq.html">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero-split">
      <div class="hero-info">
        <h1>LA VELADA DEL AÑO VII</h1>
        <p class="subtitle">L'esdeveniment de l'any a l'Estadi Olímpic de Barcelona</p>
        <p class="date">15 de Juliol de 2027</p>
        
        <div id="countdown" class="countdown-container">
          <div class="time-card"><span id="days">00</span><label>Dies</label></div>
          <div class="time-card"><span id="hours">00</span><label>Hores</label></div>
          <div class="time-card"><span id="minutes">00</span><label>Minuts</label></div>
          <div class="time-card"><span id="seconds">00</span><label>Segons</label></div>
        </div>
      
        <a href="entrades.html" class="btn-primary">Aconsegueix les teves entrades</a>
      </div>

      <div class="poster-wrapper">
        <img src="img/Poster de La Velada del año VII.png" alt="Pòster Oficial La Velada del Año VII" class="event-poster">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 WDHL Solutions. Projecte de Walid fictici.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
